name: confluence

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # STUN/TURN. Idle until Phase 3 — the API mints HMAC credentials against
  # TURN_STATIC_AUTH_SECRET, so this container and the API share that secret
  # and nothing is ever hardcoded in the client.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    ports:
      - '${TURN_PORT:-3478}:3478/udp'
      - '${TURN_PORT:-3478}:3478/tcp'
      # Deliberately narrow relay range: Docker Desktop on Windows cannot
      # publish the default 49152-65535 span without pathological startup times.
      - '49160-49200:49160-49200/udp'
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${TURN_REALM}
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET}

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      # Inside the compose network, reach peers by service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    env_file:
      - ../.env
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - ../.env
    # Prod target is static files behind nginx on :80, published on the same
    # host port as the Vite dev server so the URL does not change.
    ports:
      - '5173:80'

volumes:
  pgdata:
  redisdata:
