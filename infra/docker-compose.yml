name: confluence

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # STUN/TURN. Idle until Phase 3 — the API mints HMAC credentials against
  # TURN_STATIC_AUTH_SECRET, so this container and the API share that secret
  # and nothing is ever hardcoded in the client.
  coturn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    ports:
      - '${TURN_PORT:-3478}:3478/udp'
      - '${TURN_PORT:-3478}:3478/tcp'
      # Deliberately narrow relay range: Docker Desktop on Windows cannot
      # publish the default 49152-65535 span without pathological startup times.
      - '49160-49200:49160-49200/udp'
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${TURN_REALM}
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET}

  # Local SMTP sink. Every email the API sends in development lands here instead
  # of a real inbox. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.29
    restart: unless-stopped
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '8025:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for encrypted file uploads (Phase 5). Holds
  # ciphertext only. Pinned to MinIO's last published community image; the
  # API speaks plain S3, so production can use AWS S3 or Cloudflare R2.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # Browsers upload and download directly with presigned URLs, cross-origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      # Inside the compose network, reach peers by service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Server-side S3 calls go container-to-container; presigned URLs keep
      # S3_PUBLIC_ENDPOINT, which the browser can reach.
      S3_ENDPOINT: http://minio:9000
    env_file:
      - ../.env
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - ../.env
    # Prod target is static files behind nginx on :80, published on the same
    # host port as the Vite dev server so the URL does not change.
    ports:
      - '5173:80'

volumes:
  pgdata:
  redisdata:
  miniodata:
