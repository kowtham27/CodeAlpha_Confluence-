server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routes (/login, /verify-email...) are not files on disk. Serve
  # the app shell for them so a reload or an emailed link does not 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite fingerprints asset filenames, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The shell must always be revalidated, or users keep a stale build.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Phase 7 adds the strict nonce-based CSP here, so it covers every response.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  server_tokens off;
}
