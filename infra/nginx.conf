server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Security headers (CSP and friends). Repeated in each location below that
  # sets a header of its own: nginx does not inherit add_header into those.
  include /etc/nginx/snippets/security-headers.conf;

  # Client-side routes (/login, /verify-email...) are not files on disk. Serve
  # the app shell for them so a reload or an emailed link does not 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite fingerprints asset filenames, so they can be cached forever.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The shell must always be revalidated, or users keep a stale build.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
}
