# coturn config for local development.
# realm and static-auth-secret are injected as CLI flags by docker-compose so
# they stay in .env and out of version control.

listening-port=3478
fingerprint

# Long-term credentials derived per-session via HMAC (RFC 5766 TURN REST API).
# The API mints these at room-join time in Phase 3; they expire in 12h.
use-auth-secret

# Relay port range must match the published range in docker-compose.yml.
min-port=49160
max-port=49200

# Dev hardening. Production additionally needs TLS (5349) and a real cert.
no-tlsv1
no-tlsv1_1
no-multicast-peers
no-cli

# Block relaying to internal ranges so a malicious client cannot use the TURN
# server to port-scan the host network. Loopback is denied outright.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=10.0.0.0-10.255.255.255

verbose
